[project]
name = "squawkbox"
version = "0.1.0"
description = "An evaluation harness for manage-by-exception freight agents"
readme = "README.md"
authors = [
    { name = "martyn-v", email = "m@rtyn.io" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "faker>=40.36.0",
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "structlog>=26.1.0",
]

[project.scripts]
squawkbox = "squawkbox:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
